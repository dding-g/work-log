# ============================================================
# 일일 업무일지 생성 워크플로우
# ============================================================
#
# 이 워크플로우는 매일 자동으로 Lambda API를 호출하여
# 업무일지를 생성하고 Slack으로 전송합니다.
#
# 필요한 GitHub Secrets:
# - LAMBDA_FUNCTION_URL: Lambda 함수 URL (API Gateway 또는 Function URL)
# - SLACK_WEBHOOK_URL: Slack Webhook URL (선택)
#

name: Daily Worklog

on:
  # 매일 KST 오전 9시 (UTC 0시) 실행
  schedule:
    - cron: '0 0 * * *'

  # 수동 실행 지원
  workflow_dispatch:
    inputs:
      target_date:
        description: '대상 날짜 (YYYY-MM-DD, 비워두면 어제)'
        required: false
        default: ''

env:
  TZ: Asia/Seoul

jobs:
  generate-worklog:
    name: Generate Worklog via Lambda
    runs-on: ubuntu-latest

    steps:
      # ----- 1. 날짜 설정 -----
      - name: Set target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            # 어제 날짜 (KST 기준)
            TARGET_DATE=$(TZ=Asia/Seoul date -d "yesterday" +%Y-%m-%d)
          fi

          echo "target_date=${TARGET_DATE}" >> $GITHUB_OUTPUT
          echo "📅 대상 날짜: ${TARGET_DATE}"

      # ----- 2. Lambda API 호출 -----
      - name: Call Lambda API
        id: lambda
        env:
          LAMBDA_URL: ${{ secrets.LAMBDA_FUNCTION_URL }}
        run: |
          echo "🚀 Lambda API 호출 중..."

          # Lambda 함수 URL이 없으면 스킵
          if [ -z "$LAMBDA_URL" ]; then
            echo "⚠️ LAMBDA_FUNCTION_URL이 설정되지 않았습니다."
            echo "success=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # POST 요청으로 업무일지 생성
          RESPONSE=$(curl -s -X POST "${LAMBDA_URL}/generate" \
            -H "Content-Type: application/json" \
            -d "{
              \"target_date\": \"${{ steps.date.outputs.target_date }}\",
              \"use_ai_summary\": true
            }")

          echo "응답: ${RESPONSE}"

          # 성공 여부 확인
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')

          if [ "$SUCCESS" = "true" ]; then
            echo "✅ 업무일지 생성 성공!"
            echo "success=true" >> $GITHUB_OUTPUT

            # AI 요약 추출 (Slack 전송용)
            AI_SUMMARY=$(echo "$RESPONSE" | jq -r '.worklog.ai_summary // "요약 없음"')
            # 멀티라인 출력을 위한 처리
            {
              echo "ai_summary<<SUMMARY_EOF"
              echo "$AI_SUMMARY"
              echo "SUMMARY_EOF"
            } >> $GITHUB_OUTPUT

            # 통계 추출
            COMMITS=$(echo "$RESPONSE" | jq -r '.worklog.stats.total_commits // 0')
            echo "total_commits=${COMMITS}" >> $GITHUB_OUTPUT
          else
            echo "❌ 업무일지 생성 실패"
            ERROR=$(echo "$RESPONSE" | jq -r '.error // "알 수 없는 오류"')
            echo "error=${ERROR}" >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      # ----- 3. Slack 알림 -----
      - name: Send to Slack
        if: steps.lambda.outputs.success == 'true' && secrets.SLACK_WEBHOOK_URL
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          TOTAL_COMMITS: ${{ steps.lambda.outputs.total_commits }}
          AI_SUMMARY: ${{ steps.lambda.outputs.ai_summary }}
        run: |
          echo "📨 Slack 전송 중..."

          # AI 요약을 JSON 이스케이프
          ESCAPED_SUMMARY=$(echo "$AI_SUMMARY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

          # Slack 메시지 구성
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"📝 업무일지 - ${TARGET_DATE}\",
                    \"emoji\": true
                  }
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*📊 통계*\n커밋 수: ${TOTAL_COMMITS}개\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*📋 AI 요약*\n${AI_SUMMARY}\"
                  }
                },
                {
                  \"type\": \"context\",
                  \"elements\": [
                    {
                      \"type\": \"mrkdwn\",
                      \"text\": \"자동 생성됨 | $(date '+%Y-%m-%d %H:%M:%S')\"
                    }
                  ]
                }
              ]
            }"

          echo "✅ Slack 전송 완료!"

      # ----- 4. 실패 알림 -----
      - name: Notify failure
        if: failure() && secrets.SLACK_WEBHOOK_URL
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"⚠️ 업무일지 생성 실패\n날짜: ${{ steps.date.outputs.target_date }}\n워크플로우: ${{ github.workflow }}\"
            }"
