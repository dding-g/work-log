name: Daily Worklog

on:
  # 매일 KST 오전 2시 (UTC 17시) 실행
  schedule:
    - cron: '0 17 * * *'

  # 수동 실행 지원
  workflow_dispatch:
    inputs:
      target_date:
        description: '대상 날짜 (YYYY-MM-DD, 비워두면 어제)'
        required: false
        default: ''

env:
  TZ: Asia/Seoul
  PYTHON_VERSION: '3.11'

jobs:
  generate-worklog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 필요

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # LLM 라이브러리 (선택적)
          pip install openai anthropic || true

      - name: Generate worklog via API
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # API 서버를 백그라운드로 실행
          python -m uvicorn core.api:app --host 127.0.0.1 --port 8000 &
          sleep 5  # 서버 시작 대기

          # 날짜 설정
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE=$(date -d "yesterday" +%Y-%m-%d)
          fi

          echo "대상 날짜: $TARGET_DATE"

          # API 호출
          curl -X POST http://127.0.0.1:8000/generate \
            -H "Content-Type: application/json" \
            -d "{\"target_date\": \"$TARGET_DATE\", \"use_ai_summary\": true}" \
            -o response.json

          # 결과 확인
          cat response.json

          # 서버 종료
          pkill -f uvicorn || true

      - name: Upload worklog artifact
        uses: actions/upload-artifact@v4
        with:
          name: worklog-${{ github.run_id }}
          path: worklog/*.md
          retention-days: 30

      - name: Commit worklog
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status worklog/ --porcelain)" ]; then
            git add worklog/
            git commit -m "docs: 업무일지 자동 생성 ($(date +%Y-%m-%d))"
            git push
          else
            echo "변경사항 없음"
          fi

      - name: Send to Slack
        if: success() && secrets.SLACK_WEBHOOK_URL
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # 최신 업무일지 내용 가져오기
          WORKLOG_FILE=$(ls -t worklog/*.md 2>/dev/null | head -1)

          if [ -f "$WORKLOG_FILE" ]; then
            # 파일 내용을 JSON 이스케이프
            CONTENT=$(cat "$WORKLOG_FILE" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": ${CONTENT}}"
          fi
