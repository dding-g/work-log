# ============================================================
# AWS Lambda ZIP 배포 워크플로우
# ============================================================
#
# 이 워크플로우는:
# 1. Python 의존성 설치
# 2. Lambda ZIP 패키지 생성
# 3. Lambda 함수 업데이트
#
# 필요한 GitHub Secrets:
# - AWS_ACCESS_KEY_ID: AWS 액세스 키
# - AWS_SECRET_ACCESS_KEY: AWS 시크릿 키
# - AWS_REGION: AWS 리전 (예: ap-northeast-2)
# - LAMBDA_FUNCTION_NAME: Lambda 함수 이름
#

name: Deploy to Lambda

# ============================================================
# 트리거 설정
# ============================================================

on:
  # main 브랜치에 푸시될 때
  push:
    branches:
      - main
      - master
    # 특정 파일이 변경될 때만 실행
    paths:
      - 'core/**'
      - 'requirements-lambda.txt'
      - '.github/workflows/deploy-lambda.yml'

  # 수동 실행 지원
  workflow_dispatch:

# ============================================================
# 환경 변수
# ============================================================

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}
  PYTHON_VERSION: '3.11'

# ============================================================
# 작업 정의
# ============================================================

jobs:
  deploy:
    name: Build and Deploy ZIP
    runs-on: ubuntu-latest

    steps:
      # ----- 1. 코드 체크아웃 -----
      - name: Checkout code
        uses: actions/checkout@v4

      # ----- 2. Python 설정 -----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ----- 3. AWS 자격 증명 설정 -----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----- 4. 의존성 설치 및 패키징 -----
      - name: Install dependencies and create package
        run: |
          echo "의존성 설치 중..."

          # 패키지 디렉토리 생성
          mkdir -p package

          # Lambda용 의존성 설치 (boto3는 Lambda에 기본 포함)
          pip install -r requirements-lambda.txt -t package/

          # core 디렉토리 복사
          cp -r core package/

          # __init__.py 생성 (모듈 인식용)
          touch package/core/__init__.py

          echo "패키지 구조:"
          ls -la package/
          ls -la package/core/

      # ----- 5. ZIP 파일 생성 -----
      - name: Create ZIP package
        run: |
          cd package
          zip -r ../lambda-package.zip .
          cd ..

          echo "ZIP 파일 정보:"
          ls -lh lambda-package.zip

          # ZIP 크기 확인 (250MB 제한)
          SIZE=$(stat -c%s lambda-package.zip 2>/dev/null || stat -f%z lambda-package.zip)
          echo "ZIP 크기: $SIZE bytes"

          if [ $SIZE -gt 262144000 ]; then
            echo "❌ ZIP 파일이 250MB를 초과합니다!"
            exit 1
          fi

      # ----- 6. Lambda 함수 업데이트 -----
      - name: Update Lambda function
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          echo "Lambda 함수 업데이트 중..."
          echo "함수: ${LAMBDA_FUNCTION_NAME}"

          # Lambda 함수 코드 업데이트
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://lambda-package.zip \
            --publish

          echo "Lambda 함수 업데이트 완료!"

      # ----- 7. 배포 대기 -----
      - name: Wait for Lambda update
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          echo "Lambda 함수 업데이트 대기 중..."

          # 함수가 Active 상태가 될 때까지 대기
          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"

          echo "Lambda 함수가 활성화되었습니다!"

      # ----- 8. Lambda 테스트 호출 -----
      - name: Test Lambda invocation
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          echo "Lambda 테스트 호출 중..."

          # 테스트 이벤트로 Lambda 호출
          aws lambda invoke \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --payload '{"test": true}' \
            --cli-binary-format raw-in-base64-out \
            response.json

          echo "Lambda 응답:"
          cat response.json

          # 응답 확인
          if grep -q '"statusCode": 200' response.json || grep -q '"statusCode":200' response.json; then
            echo "✅ Lambda 테스트 성공!"
          else
            echo "⚠️ Lambda 응답 확인 필요"
          fi

      # ----- 9. 배포 완료 알림 -----
      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "🚀 배포 완료!"
          echo "=============================================="
          echo "Lambda 함수: ${{ secrets.LAMBDA_FUNCTION_NAME }}"
          echo "시각: $(date)"
          echo "=============================================="
